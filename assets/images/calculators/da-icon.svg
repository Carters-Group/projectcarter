<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(180,205,232,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- development site: a surveyed land parcel with corner pegs -->
  <rect x="270" y="230" width="260" height="200" fill="none" stroke="#5fa1d0" stroke-width="6" stroke-dasharray="14 12" opacity="0.9"/>
  <g stroke="#5fa1d0" stroke-width="6" stroke-linecap="round" opacity="0.92">
    <line x1="270" y1="230" x2="270" y2="210"/>
    <line x1="270" y1="230" x2="250" y2="230"/>
    <line x1="530" y1="230" x2="530" y2="210"/>
    <line x1="530" y1="230" x2="550" y2="230"/>
    <line x1="270" y1="430" x2="270" y2="450"/>
    <line x1="270" y1="430" x2="250" y2="430"/>
    <line x1="530" y1="430" x2="530" y2="450"/>
    <line x1="530" y1="430" x2="550" y2="430"/>
  </g>
  <g stroke="#5fa1d0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M400 290 C 370 320 370 350 400 380 C 430 350 430 320 400 290 Z"/>
    <circle cx="400" cy="325" r="14"/>
  </g>
</svg>
