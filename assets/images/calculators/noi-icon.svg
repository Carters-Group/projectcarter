<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(180,205,232,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- net operating income: a building with a income/expense ledger -->
  <g stroke="#5fa1d0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.92">
    <rect x="300" y="260" width="140" height="200"/>
    <line x1="330" y1="290" x2="350" y2="290"/>
    <line x1="330" y1="330" x2="350" y2="330"/>
    <line x1="330" y1="370" x2="350" y2="370"/>
    <line x1="390" y1="290" x2="410" y2="290"/>
    <line x1="390" y1="330" x2="410" y2="330"/>
    <line x1="390" y1="370" x2="410" y2="370"/>
    <line x1="360" y1="410" x2="380" y2="410"/>
    <line x1="360" y1="410" x2="360" y2="460"/>
    <line x1="380" y1="410" x2="380" y2="460"/>
  </g>
  <circle cx="490" cy="250" r="42" fill="none" stroke="#5fa1d0" stroke-width="6" opacity="0.92"/>
  <text x="490" y="268" font-family="Inter, sans-serif" font-size="46" font-weight="600" fill="#5fa1d0" text-anchor="middle" opacity="0.9">$</text>
</svg>
