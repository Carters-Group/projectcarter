<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(180,205,232,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- portfolio: a row of property blocks of varying scale -->
  <g stroke="#5fa1d0" stroke-width="6" stroke-linejoin="round" fill="none" opacity="0.92">
    <rect x="270" y="330" width="80" height="130"/>
    <rect x="360" y="270" width="90" height="190"/>
    <rect x="460" y="310" width="70" height="150"/>
  </g>
  <g fill="#5fa1d0" opacity="0.7">
    <circle cx="295" cy="360" r="5"/>
    <circle cx="325" cy="360" r="5"/>
    <circle cx="385" cy="305" r="5"/>
    <circle cx="415" cy="305" r="5"/>
    <circle cx="415" cy="345" r="5"/>
    <circle cx="480" cy="340" r="5"/>
  </g>
  <line x1="250" y1="460" x2="550" y2="460" stroke="#5fa1d0" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
</svg>
